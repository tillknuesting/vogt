name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: scripts/ci.sh
        env:
          FUZZTIME: 10s
